name: Release

on:
  # nightly
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if chaiNNer main has no commits since the last nightly"
        type: boolean
        default: false

jobs:
  # GitHub disables scheduled workflows after 60 days without activity in
  # this repo, which gets no commits of its own. Re-enabling through the API
  # every night keeps the schedule alive (the same approach as
  # gautamkrishnar/keepalive-workflow's API mode).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/release.yml/enable"

  # Decides whether to build, and pins the chaiNNer commit and date every
  # build job uses, so a commit landing mid-run or a run crossing midnight
  # can't split one nightly across two versions.
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.notes.outputs.changed == 'true' || inputs.force == true }}
      head: ${{ steps.notes.outputs.head }}
      tag: ${{ steps.date.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout chaiNNer main
        run: git submodule update --init --recursive --remote
      - name: Date
        id: date
        run: echo "tag=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Changelog since the last nightly
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/release-notes.sh ./chaiNNer "${{ github.repository }}" "${{ steps.date.outputs.tag }}" notes.md >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          cat notes.md

  release:
    needs: [setup]
    if: needs.setup.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]

    env:
      TAG: ${{ needs.setup.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout chaiNNer at the pinned commit
        shell: bash
        run: |
          git submodule update --init --recursive --remote
          git -C chaiNNer checkout --quiet "${{ needs.setup.outputs.head }}"
      # Same toolchain as chaiNNer's own release.yml and make.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chaiNNer/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # node-gyp builds appdmg's native addons and imports distutils, which
      # Python 3.12 removed; setuptools provides it. Without it npm silently
      # drops appdmg and the dmg maker fails.
      - name: Install setuptools (macos)
        if: runner.os == 'macOS'
        run: python3 -m pip install setuptools
      - name: Install dependencies
        run: cd ./chaiNNer && npm ci
      - name: Increase patch version
        shell: bash
        run: |
          cd ./chaiNNer
          npm version patch --no-git-tag-version
          PKG_VERSION=$(npm pkg get version --workspaces=false | tr -d \")-nightly.$TAG
          npm version $PKG_VERSION --no-git-tag-version
      - name: Build nightly release
        shell: bash
        run: |
          cd ./chaiNNer
          if [[ "${{ runner.os }}" != "macOS" ]]; then
              npm run make -- --no-sign
          else
              npm run make -- --arch=universal --no-sign
          fi
      # Rename to chaiNNer-<os>-nightly.<date>.<ext>; .github/scripts/downloads.sh
      # matches these names. The Squirrel .nupkg and its RELEASES index are
      # updater files nothing uses here.
      - name: Rename assets
        shell: bash
        run: |
          cd ./chaiNNer/out/make
          find . -iname '*.nupkg' -delete
          find . -name RELEASES -delete
          for ext in zip dmg deb rpm exe; do
            f="$(find . -iname "*.$ext" | head -n 1)"
            if [ -n "$f" ]; then
              mv "$f" "./chaiNNer-${{ matrix.os }}-nightly.$TAG.$ext"
            fi
          done
          ls -la
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./chaiNNer/out/make/chaiNNer-*-nightly.*
          tag: ${{ env.TAG }}
          overwrite: true
          body: ${{ needs.setup.outputs.notes }}
          release_name: Nightly builds from ${{ env.TAG }}
          prerelease: false

  # Adds a downloads table listing what actually uploaded, so a failed
  # platform shows as failed instead of a dead link.
  finalize:
    needs: [setup, release]
    if: always() && needs.setup.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add downloads to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
          NOTES: ${{ needs.setup.outputs.notes }}
        run: |
          if ! gh release view "$TAG" -R "${{ github.repository }}" > /dev/null 2>&1; then
            echo "No release $TAG: every build failed."
            exit 1
          fi
          {
            printf '%s\n\n' "$NOTES"
            bash .github/scripts/downloads.sh "${{ github.repository }}" "$TAG"
          } > notes.md
          cat notes.md
          gh release edit "$TAG" -R "${{ github.repository }}" --notes-file notes.md
