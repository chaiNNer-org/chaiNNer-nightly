name: Release

on:
  # nightly
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if chaiNNer main has no commits in the last 24 hours"
        type: boolean
        default: false

jobs:
  # GitHub disables scheduled workflows after 60 days without activity in
  # this repo, which gets no commits of its own. Re-enabling through the API
  # every night keeps the schedule alive (the same approach as
  # gautamkrishnar/keepalive-workflow's API mode).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/release.yml/enable"

  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      COMMITS: ${{ steps.get_commits.outputs.COMMITS }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout submodules
        run: git submodule update --init --recursive --remote
      - name: Get commits last 24 hours
        id: get_commits
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "COMMITS=forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd ./chaiNNer
          commits=$(git rev-list --no-merges HEAD --not $(git rev-list -n1 --before="24 hours" --first-parent HEAD) | tr '\n' ' ')
          echo "COMMITS=${commits}" >> "$GITHUB_OUTPUT"

  release:
    needs: [setup]
    if: ${{ needs.setup.outputs.COMMITS }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]

    steps:
      - name: Get current time
        uses: josStorer/get-current-time@v2.0.1
        id: current-time
        with:
          format: YYYY-MM-DD
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout submodules
        run: git submodule update --init --recursive --remote
      # Same toolchain as chaiNNer's own release.yml and make.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chaiNNer/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # node-gyp builds appdmg's native addons and imports distutils, which
      # Python 3.12 removed; setuptools provides it. Without it npm silently
      # drops appdmg and the dmg maker fails.
      - name: Install setuptools (macos)
        if: runner.os == 'macOS'
        run: python3 -m pip install setuptools
      - name: Install dependencies
        run: cd ./chaiNNer && npm ci
      - name: Increase patch version
        shell: bash
        run: |
          cd ./chaiNNer
          npm version patch --no-git-tag-version
          PKG_VERSION=$(npm pkg get version --workspaces=false | tr -d \")-nightly.${{ steps.current-time.outputs.formattedTime }}
          npm version $PKG_VERSION --no-git-tag-version
      - name: Build nightly release
        shell: bash
        run: |
          cd ./chaiNNer
          if [[ "${{ runner.os }}" != "macOS" ]]; then
              npm run make -- --no-sign
          else
              npm run make -- --arch=universal --no-sign
          fi
      - name: Set file name env vars
        shell: bash
        run: |
          echo "ZIP=$(find ./chaiNNer/out/make/ -iname '*.zip')" >> $GITHUB_ENV
          echo "DMG=$(find ./chaiNNer/out/make/ -iname '*.dmg')" >> $GITHUB_ENV
          echo "DEB=$(find ./chaiNNer/out/make/ -iname '*.deb')" >> $GITHUB_ENV
          echo "RPM=$(find ./chaiNNer/out/make/ -iname '*.rpm')" >> $GITHUB_ENV
          echo "EXE=$(find ./chaiNNer/out/make/ -iname '*.exe')" >> $GITHUB_ENV
          echo "NUPKG=$(find ./chaiNNer/out/make/ -iname '*.nupkg')" >> $GITHUB_ENV
      - name: Rename zip assets
        if: ${{ env.ZIP }}
        shell: bash
        run: mv "${{ env.ZIP }}" "./chaiNNer/out/make/chaiNNer-${{ matrix.os }}-nightly.${{ steps.current-time.outputs.formattedTime }}.zip"
      - name: Rename dmg assets
        if: ${{ env.DMG }}
        shell: bash
        run: mv "${{ env.DMG }}" "./chaiNNer/out/make/chaiNNer-${{ matrix.os }}-nightly.${{ steps.current-time.outputs.formattedTime }}.dmg"
      - name: Rename deb assets
        if: ${{ env.DEB }}
        shell: bash
        run: mv "${{ env.DEB }}" "./chaiNNer/out/make/chaiNNer-${{ matrix.os }}-nightly.${{ steps.current-time.outputs.formattedTime }}.deb"
      - name: Rename rpm assets
        if: ${{ env.RPM }}
        shell: bash
        run: mv "${{ env.RPM }}" "./chaiNNer/out/make/chaiNNer-${{ matrix.os }}-nightly.${{ steps.current-time.outputs.formattedTime }}.rpm"
      - name: Rename exe assets
        if: ${{ env.EXE }}
        shell: bash
        run: mv "${{ env.EXE }}" "./chaiNNer/out/make/chaiNNer-${{ matrix.os }}-nightly.${{ steps.current-time.outputs.formattedTime }}.exe"
      - name: Delete nupkg assets
        if: ${{ env.NUPKG }}
        shell: bash
        run: rm "${{ env.NUPKG }}"
      - name: Get commit history (past 24 hours)
        shell: bash
        run: |
          cd ./chaiNNer
          echo "Built on ${{ steps.current-time.outputs.formattedTime }}" > history.txt
          git log --no-merges HEAD --not $(git rev-list -n1 --before="24 hours" --first-parent HEAD) --pretty=format:"[%h](https://github.com/chaiNNer-org/chaiNNer/commit/%H) - %s (%cr) <%an>" >> history.txt
      - name: Read history.txt as the release body
        id: read_release
        shell: bash
        run: |
          {
            echo "RELEASE_BODY<<HISTORY_EOF"
            cat ./chaiNNer/history.txt
            echo
            echo "HISTORY_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload new release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./chaiNNer/out/make/**
          tag: ${{ steps.current-time.outputs.formattedTime }}
          overwrite: true
          body: |
            ${{ steps.read_release.outputs.RELEASE_BODY }}
          release_name: Nightly builds from ${{ steps.current-time.outputs.formattedTime }}
          prerelease: false
